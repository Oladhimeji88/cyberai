services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  opa:
    image: openpolicyagent/opa:0.68.0
    command: ["run", "--server", "--set=decision_logs.console=true", "/policies"]
    ports:
      - "8181:8181"
    volumes:
      - ../../policies:/policies

  demo-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      PUBLIC_KEY: ""
      USER_NAME: demo
      USER_PASSWORD: demo123
      PASSWORD_ACCESS: true
      SUDO_ACCESS: false
    ports:
      - "2222:2222"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret
      ORG_ROOT_SECRET: DemoOrgRootSecret!
      WEB_ORIGIN: http://localhost:3000
      OPA_URL: http://opa:8181
      AWS_REGION: us-east-1
      DEMO_SSH_HOST: demo-ssh
      DEMO_SSH_PORT: 2222
      DEMO_SSH_USER: demo
    depends_on:
      - postgres
      - redis
      - opa
      - demo-ssh
    ports:
      - "4000:4000"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata: